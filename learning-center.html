ve lessons\" class=\"learning-model-stage__semantic sr-only\">\n<article>\n<h3>AI 101</h3>\n<ul>\n<li>\n<strong>AI assists. People decide.</strong> Use artificial\n                intelligence to support judgment, not replace responsibility.\n              </li>\n<li>\n<strong>Context creates clarity.</strong> Explain the goal,\n                audience, source material, and desired format before asking for\n                an answer.\n              </li>\n<li>\n<strong>Verify before you rely.</strong> Check important facts,\n                dates, calculations, and claims before using AI-generated work.\n              </li>\n<li>\n<strong>Protect private information.</strong> Never enter\n                confidential customer, employee, financial, or health\n                information without an approved process.\n              </li>\n<li>\n<strong>The first answer is a draft.</strong> Question, refine,\n                and improve the output instead of treating it as finished work.\n              </li>\n</ul>\n</article>\n<article>\n<h3>Practical Everyday AI</h3>\n<ul>\n<li>\n<strong>AI Safety Basics.</strong> Know what information should\n                stay out of public AI tools.\n              </li>\n<li>\n<strong>Better Prompts.</strong> Give useful context, define the\n                task, and ask for a clear format.\n              </li>\n<li>\n<strong>Check the Answer.</strong> Verify facts and claims\n                before relying on output.\n              </li>\n<li>\n<strong>Use Existing Tools.</strong> Look for AI features you\n                already pay for.\n              </li>\n<li>\n<strong>Protect Human Judgment.</strong> Let AI support\n                thinking, not replace responsibility.\n              </li>\n<li>\n<strong>Run Small Experiments.</strong> Test, measure, learn,\n                and adapt.\n              </li>\n</ul>\n</article>\n<article>\n<h3>Strategy Lab</h3>\n<ul>\n<li>\n<strong>Solve problems. Do not chase tools.</strong> Build AI\n                strategy around a valuable business need, not the newest\n                technology.\n              </li>\n<li>\n<strong>Clean data comes first.</strong> Organized, connected\n                information creates more useful automation, reporting, and\n                predictions.\n              </li>\n<li>\n<strong>Automate stable processes.</strong> Simplify and\n                document a process before asking technology to repeat it.\n              </li>\n<li>\n<strong>Keep humans at consequence points.</strong> Require\n                human review wherever decisions affect people, money, safety, or\n                trust.\n              </li>\n<li>\n<strong>Scale proven systems.</strong> Expand only after a small\n                system consistently produces measurable value.\n              </li>\n</ul>\n</article>\n</div>\n<span aria-hidden=\"true\" class=\"ah1483-section-break ah1483-section-break--bottom\"></span></section>\n</main>\n<footer class=\"site-footer site-footer--minimal\" id=\"site-footer\">\n<div class=\"shell minimal-footer-row\">\n<nav aria-label=\"Primary navigation\" class=\"footer-primary-nav\" id=\"primary-nav\" style=\"position:absolute!important;left:50%!important;right:auto!important;top:50%!important;bottom:auto!important;width:max-content!important;max-width:calc(100vw - 16px)!important;height:70px!important;min-height:70px!important;max-height:70px!important;margin:0!important;padding:0!important;transform:translate3d(-50%,-50%,0)!important;overflow:visible!important;\">\n<div class=\"primary-nav__group primary-nav__group--centered\" style=\"display:flex!important;flex-flow:row nowrap!important;align-items:center!important;justify-content:center!important;width:max-content!important;max-width:none!important;height:70px!important;min-height:70px!important;max-height:70px!important;margin:0!important;padding:0!important;gap:var(--ah1653-footer-gap)!important;\">\n<a class=\"r973-pink-edge footer-structure-co
