<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" preserveAspectRatio="none">
  <defs>
    <!-- Bright continuous aluminum. Dark and colored tones are reflections in
         the alloy rather than separate painted bands. -->
    <linearGradient id="aluminum-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667681"/><stop offset=".08" stop-color="#d7dfe1"/>
      <stop offset=".18" stop-color="#8999a2"/><stop offset=".31" stop-color="#e6e9e8"/>
      <stop offset=".43" stop-color="#71828c"/><stop offset=".56" stop-color="#cbd3d5"/>
      <stop offset=".70" stop-color="#536674"/><stop offset=".83" stop-color="#dbe1e2"/>
      <stop offset=".93" stop-color="#7f909a"/><stop offset="1" stop-color="#c5ced0"/>
    </linearGradient>
    <linearGradient id="soft-sheen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#08111b" stop-opacity=".20"/><stop offset=".18" stop-color="#dff7f4" stop-opacity=".30"/>
      <stop offset=".34" stop-color="#19344a" stop-opacity=".23"/><stop offset=".51" stop-color="#f7f8f5" stop-opacity=".38"/>
      <stop offset=".68" stop-color="#172b43" stop-opacity=".24"/><stop offset=".84" stop-color="#fff1f8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#101923" stop-opacity=".20"/>
    </linearGradient>
    <linearGradient id="edge-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8f7"/><stop offset=".13" stop-color="#8fffd7" stop-opacity=".63"/>
      <stop offset=".27" stop-color="#80919d"/><stop offset=".43" stop-color="#e7edf0"/>
      <stop offset=".58" stop-color="#ff62b8" stop-opacity=".51"/><stop offset=".73" stop-color="#6d8494"/>
      <stop offset=".88" stop-color="#8fffd7" stop-opacity=".52"/><stop offset="1" stop-color="#e4e9e8"/>
    </linearGradient>
    <!-- Two crossing low-opacity washes keep brand color moving through every
         side of the aluminum while preserving its bright metallic value. -->
    <linearGradient id="brand-flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70f4ce" stop-opacity=".38"/>
      <stop offset=".14" stop-color="#3f7aa0" stop-opacity=".28"/>
      <stop offset=".29" stop-color="#f15bac" stop-opacity=".34"/>
      <stop offset=".44" stop-color="#244f76" stop-opacity=".30"/>
      <stop offset=".59" stop-color="#77e8c7" stop-opacity=".34"/>
      <stop offset=".74" stop-color="#e854a6" stop-opacity=".33"/>
      <stop offset=".88" stop-color="#315e82" stop-opacity=".29"/>
      <stop offset="1" stop-color="#82f0d0" stop-opacity=".36"/>
    </linearGradient>
    <linearGradient id="brand-cross" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6fbd" stop-opacity=".24"/>
      <stop offset=".20" stop-color="#73e9ca" stop-opacity=".25"/>
      <stop offset=".40" stop-color="#294e70" stop-opacity=".23"/>
      <stop offset=".60" stop-color="#ef65b1" stop-opacity=".24"/>
      <stop offset=".80" stop-color="#376b8d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7cf0cf" stop-opacity=".25"/>
    </linearGradient>
    <!-- Wide low-opacity reflections keep brand color present without hard bands. -->
    <radialGradient id="mint-top" gradientUnits="userSpaceOnUse" cx="82" cy="6" r="235"><stop stop-color="#8fffd7" stop-opacity=".28"/><stop offset=".42" stop-color="#49cfae" stop-opacity=".14"/><stop offset="1" stop-color="#49cfae" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue-top" gradientUnits="userSpaceOnUse" cx="292" cy="4" r="250"><stop stop-color="#214b73" stop-opacity=".30"/><stop offset=".48" stop-color="#102c48" stop-opacity=".13"/><stop offset="1" stop-color="#102c48" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink-top" gradientUnits="userSpaceOnUse" cx="494" cy="22" r="230"><stop stop-color="#ff4fb2" stop-opacity=".23"/><stop offset=".46" stop-color="#c73584" stop-opacity=".12"/><stop offset="1" stop-color="#c73584" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink-left" gradientUnits="userSpaceOnUse" cx="2" cy="260" r="245"><stop stop-color="#e846a4" stop-opacity=".20"/><stop offset=".50" stop-color="#7f285f" stop-opacity=".10"/><stop offset="1" stop-color="#7f285f" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint-left" gradientUnits="userSpaceOnUse" cx="8" cy="474" r="225"><stop stop-color="#8fffd7" stop-opacity=".25"/><stop offset=".48" stop-color="#3fb596" stop-opacity=".11"/><stop offset="1" stop-color="#3fb596" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue-right" gradientUnits="userSpaceOnUse" cx="507" cy="242" r="235"><stop stop-color="#27547b" stop-opacity=".28"/><stop offset=".47" stop-color="#153650" stop-opacity=".12"/><stop offset="1" stop-color="#153650" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint-right" gradientUnits="userSpaceOnUse" cx="505" cy="438" r="228"><stop stop-color="#83f5cf" stop-opacity=".24"/><stop offset=".48" stop-color="#36a98d" stop-opacity=".11"/><stop offset="1" stop-color="#36a98d" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink-bottom" gradientUnits="userSpaceOnUse" cx="182" cy="509" r="245"><stop stop-color="#ff58b8" stop-opacity=".22"/><stop offset=".46" stop-color="#b3317b" stop-opacity=".11"/><stop offset="1" stop-color="#b3317b" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue-bottom" gradientUnits="userSpaceOnUse" cx="390" cy="509" r="245"><stop stop-color="#1f5279" stop-opacity=".27"/><stop offset=".48" stop-color="#14354f" stop-opacity=".12"/><stop offset="1" stop-color="#14354f" stop-opacity="0"/></radialGradient>
    <!-- Directional micro-brushing, oxidized wear and raised pits are composited
         into one seamless surface. -->
    <filter id="worn-brushed-aluminum" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .44" numOctaves="2" seed="847" result="brush"/>
      <feColorMatrix in="brush" type="matrix" values=".52 0 0 0 .18  0 .54 0 0 .20  0 0 .58 0 .23  0 0 0 .23 0" result="brushed-grain"/>
      <feBlend in="SourceGraphic" in2="brushed-grain" mode="soft-light" result="brushed"/>
      <feTurbulence type="fractalNoise" baseFrequency=".026 .072" numOctaves="4" seed="1847" result="wear"/>
      <feGaussianBlur in="wear" stdDeviation=".32" result="soft-wear"/>
      <feDiffuseLighting in="soft-wear" surfaceScale=".76" diffuseConstant=".52" lighting-color="#e8eeec" result="worn-light"><feDistantLight azimuth="224" elevation="51"/></feDiffuseLighting>
      <feColorMatrix in="worn-light" type="matrix" values=".62 0 0 0 .04  0 .66 0 0 .05  0 0 .70 0 .06  0 0 0 .25 0" result="quiet-wear"/>
      <feBlend in="brushed" in2="quiet-wear" mode="soft-light" result="worn"/>
      <feTurbulence type="turbulence" baseFrequency=".12 .31" numOctaves="1" seed="2847" result="pits"/>
      <feColorMatrix in="pits" type="matrix" values=".20 0 0 0 .05  0 .22 0 0 .06  0 0 .25 0 .08  0 0 0 .12 0" result="fine-pits"/>
      <feBlend in="worn" in2="fine-pits" mode="multiply"/>
    </filter>
    <pattern id="hairline-wear" width="31" height="23" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
      <path d="M1 4h12 M16 9h11 M4 16h20 M20 21h8" stroke="#f5f8f6" stroke-opacity=".13" stroke-width=".48"/>
      <path d="M8 6h9 M1 13h7 M23 18h7" stroke="#263642" stroke-opacity=".14" stroke-width=".42"/>
    </pattern>
    <mask id="frame-mask"><rect width="512" height="512" fill="#fff"/><rect x="128" y="128" width="256" height="256" fill="#000"/></mask>
  </defs>
  <g mask="url(#frame-mask)" filter="url(#worn-brushed-aluminum)">
    <rect width="512" height="512" fill="url(#aluminum-body)"/><rect width="512" height="512" fill="url(#soft-sheen)"/>
    <rect width="512" height="512" fill="url(#brand-flow)" opacity=".58"/>
    <rect width="512" height="512" fill="url(#brand-cross)" opacity=".48"/>
    <rect width="512" height="512" fill="url(#mint-top)"/><rect width="512" height="512" fill="url(#blue-top)"/><rect width="512" height="512" fill="url(#pink-top)"/>
    <rect width="512" height="512" fill="url(#pink-left)"/><rect width="512" height="512" fill="url(#mint-left)"/><rect width="512" height="512" fill="url(#blue-right)"/>
    <rect width="512" height="512" fill="url(#mint-right)"/><rect width="512" height="512" fill="url(#pink-bottom)"/><rect width="512" height="512" fill="url(#blue-bottom)"/>
    <rect width="512" height="512" fill="url(#hairline-wear)" opacity=".78"/>
  </g>
  <!-- Continuous beveled highlights and dark mounting grooves. -->
  <rect x="2.5" y="2.5" width="507" height="507" fill="none" stroke="url(#edge-light)" stroke-width="5"/>
  <rect x="9" y="9" width="494" height="494" fill="none" stroke="#15222c" stroke-opacity=".82" stroke-width="7"/>
  <rect x="15" y="15" width="482" height="482" fill="none" stroke="#f1f4f2" stroke-opacity=".43" stroke-width="2"/>
  <rect x="116" y="116" width="280" height="280" fill="none" stroke="#091018" stroke-opacity=".88" stroke-width="12"/>
  <rect x="124" y="124" width="264" height="264" fill="none" stroke="url(#edge-light)" stroke-width="6"/>
  <rect x="129" y="129" width="254" height="254" fill="none" stroke="#e4eae8" stroke-opacity=".39" stroke-width="2"/>
</svg>
