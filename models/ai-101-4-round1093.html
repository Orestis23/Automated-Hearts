(()=>{'use strict';if(!THREE)return;const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,.15,8.4);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setClearColor(0x000000,0);renderer.setClearAlpha(0);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeaf7ff,0x071018,2.6));const key=new THREE.DirectionalLight(0xffffff,4.5);key.position.set(6,8,10);scene.add(key);const redLight=new THREE.PointLight(0xff315f,18,10);redLight.position.set(-3,2,4);scene.add(redLight);

function texture(i,open){const c=document.createElement('canvas');c.width=1024;c.height=720;const g=c.getContext('2d');const grad=g.createRadialGradient(512,310,20,512,360,620);grad.addColorStop(0,open?'#0D1B2A':'#0B0B0B');grad.addColorStop(.56,open?'#0B0B0B':'#0D1B2A');grad.addColorStop(1,'#06080B');g.fillStyle=grad;g.fillRect(0,0,c.width,c.height);for(let y=0;y<c.height;y+=4){g.fillStyle='rgba(255,255,255,.018)';g.fillRect(0,y,c.width,1)}const edge=open?'#39FF14':'#FF2DAA',fill='#F6F7F2';g.textAlign='center';g.textBaseline='middle';const raw=open?content[i][1]:content[i][0],words=raw.split(' ');let size=open?60:92,lines=[];while(size>30){g.font='800 '+size+'px monospace';lines=[];let line='';for(const w of words){const test=line?line+' '+w:w;if(g.measureText(test).width>800&&line){lines.push(line);line=w}else line=test}if(line)lines.push(line);if(lines.length<=4&&lines.length*size*1.16<450)break;size-=3}g.font='800 '+size+'px monospace';g.fillStyle=fill;g.strokeStyle=edge;g.lineWidth=1;g.shadowColor=edge;g.shadowBlur=7;const sp=size*1.16;lines.forEach((line,k)=>{const y=340+(k-(lines.length-1)/2)*sp;g.strokeText(line,512,y);g.fillText(line,512,y)});const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
