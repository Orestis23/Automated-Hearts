function signPointInRoot(sign){
  root.updateMatrixWorld(true);
  const p=new THREE.Vector3();
  sign.getWorldPosition(p);
  return root.worldToLocal(p);
}

function spawnHeartBurst(strand,color,burstPoint){
  const out=tubeOutward(strand,freeEndT[strand]).normalize();
  const base=new THREE.Vector3().copy(burstPoint);

  for(let k=0;k<12;k++){
    const h=makeHeartSprite(color,.40+Math.random()*.30,1);
    h.position.copy(base);

    const side=new THREE.Vector3(
      (Math.random()-.5)*1.9,
      (Math.random()-.5)*1.9,
      (Math.random()-.5)*1.9
    );
    const velocity=out.clone().multiplyScalar(2.4+Math.random()*2.0).add(side);

    root.add(h);
    heartBursts.push({
      sprite:h,
      velocity,
      start:performance.now()+k*22,
      duration:1250+Math.random()*650,
      spin:(Math.random()-.5)*3.2
    });
  }
}

    const startPos=signPointInRoot(sign);
    const tubeEntry=tubeCurves[strand].getPointAt(fromT);
    const sprite=makeHeartSprite(color,.80,1);
    sprite.position.copy(startPos);
    root.add(sprite);
