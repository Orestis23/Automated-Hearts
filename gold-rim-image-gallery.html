<!doctype html><html><head><style id="ah-progress-smooth-matte">@layer ah-progress-smooth-matte{@media all{html body #ah-page-progress#ah-page-progress::before,html body #ah-page-progress#ah-page-progress::after,html body #ah-page-progress .ah1781-page-progress-fill::before,html body #ah-page-progress .ah1781-page-progress-fill::after{content:none!important;display:none!important}html body #ah-page-progress .ah-progress-smooth-top{position:absolute!important;inset:0!important;z-index:2147483647!important;pointer-events:none!important;display:block!important;visibility:visible!important;opacity:1!important;border:0!important;outline:0!important;box-shadow:none!important;background:linear-gradient(180deg,rgba(214,229,235,.14),rgba(182,206,216,.06) 52%,rgba(120,147,160,.08))!important;mask:none!important;filter:none!important}}}</style><meta charset="utf-8"><title>Gold rim image gallery</title><style>body{margin:0;background:#10161d;color:#edf5f7;font:15px system-ui}header{padding:20px;position:sticky;top:0;background:#10161d;z-index:5}h1{font-size:22px;margin:0 0 8px}.columns,.row{display:grid;grid-template-columns:1fr 1fr;gap:24px}.columns{padding:0 24px;font-size:20px;color:#8fffd7}.row{padding:22px 24px;border-bottom:1px solid #354551}.cell{min-width:0}h2{font-size:16px;margin:0 0 12px;color:#bbcbd6}.frame{position:relative;overflow:visible}.frame>div{transform-origin:top left}small{color:#94acb9}.missing{padding:30px;border:1px dashed #465762;color:#94acb9}</style><style id="ah-progress-no-flat-edge">html body #ah-page-progress#ah-page-progress,html body .rim-page-name-screen.rim-page-name-screen{border:0!important;border-image:none!important;outline:0!important;box-shadow:none!important}html body #ah-page-progress#ah-page-progress::before,html body #ah-page-progress#ah-page-progress::after,html body .rim-page-name-screen.rim-page-name-screen::before,html body .rim-page-name-screen.rim-page-name-screen::after{border:0!important;outline:0!important;box-shadow:none!important}html body #ah-page-progress :is(.ah-clean-surface-matte,.ah-clear-matte-edge,.ah-progress-matte),html body .rim-page-name-screen :is(.ah-clean-surface-matte,.ah-clear-matte-edge,.ah-progress-matte){visibility:hidden!important;box-shadow:none!important;border:0!important;outline:0!important}</style></head><body><header><h1>Gold rim images & machine windows</h1><small id="status">Preparing desktop and mobile images…</small></header><div class="columns"><strong>Desktop</strong><strong>Mobile</strong></div><main id="gallery"></main><script>
const pages=[['index.html','Home'],['the-solution.html','The Solution'],['industries.html','Industries'],['good-information.html','Good Information'],['services.html','Services']];
async function collect(url,variant){const frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-25000px;top:0;width:'+(variant==='desktop'?1440:390)+'px;height:'+(variant==='desktop'?900:844)+'px';frame.src=url+'?'+variant+'=1';document.body.append(frame);await new Promise(r=>frame.onload=r);const doc=frame.contentDocument;if(frame.contentWindow.AHSurfaceReady)await Promise.race([frame.contentWindow.AHSurfaceReady,new Promise(r=>setTimeout(r,6000))]);await doc.fonts.ready;frame.contentWindow.AHRefreshImageFrames?.();await new Promise(r=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(r)));frame.contentWindow.AHRefreshImageFrames?.();const main=doc.querySelector('#main-content');const items=new Map();if(url==='index.html'){const rim=doc.querySelector('.ah-persistent-gold-rim')||doc.querySelector('#ah2288-mobile-complete-rim')||doc.querySelector('#ah-official-rim');if(rim){const st=frame.contentWindow.getComputedStyle(rim),rect=rim.getBoundingClientRect(),copy=document.createElement('img');copy.src='./assets/finished-images/'+variant+'-main-viewport-reference.webp';copy.alt='Main viewport rim reference';for(const p of st)copy.style.setProperty(p,st.getPropertyValue(p),'important');for(const[k,v]of Object.entries({position:'relative',inset:'auto',margin:'0',width:rect.width+'px',height:rect.height+'px',transform:'none',background:'none','z-index':'auto','box-sizing':'border-box','clip-path':'none',mask:'none','max-height':'none','min-height':'0','max-width':'none',overflow:'visible'}))copy.style.setProperty(k,v,'important');items.set('main-viewport-reference',{title:'MAIN VIEWPORT RIM · reference',clone:copy,w:rect.width,h:rect.height});}}if(main){const windows=[...main.querySelectorAll('.home-hero-engine-frame,.ah2123-mobile-window,.solution-process-window,.solution-mobile-model-shell')];const imgs=[...main.querySelectorAll('img,.premium-route-card__image-button')];for(const node of [...windows,...imgs]){let host=node;const machine=windows.includes(node);if(node.matches('img')&&(node.matches('[aria-hidden="true"]')||node.closest('.home-hero-engine-frame,.ah2123-mobile-window,.solution-process-window,.solution-mobile-model-shell')))continue;if(!machine){let found=!!node.closest('[data-ah-all-square-image-host]');if(found)host=node.closest('[data-ah-all-square-image-host]');for(let p=found?null:node;p&&p!==main;p=p.parentElement){const st=frame.contentWindow.getComputedStyle(p);if(p.hasAttribute('data-ah-all-square-image-host')||p.hasAttribute('data-ah-desktop-rim-host')||st.borderTopStyle!=='none'&&/199, 154, 67/.test(st.borderTopColor)){host=p;found=true;break}}if(!found&&!/solution-bottom-mechanical/.test(node.src))continue;}const image=node.matches('img')?node:node.querySelector('img');let title=machine?(node.matches('.home-hero-rolodex-frame,#ah2123-mobile-critical')?'Critical Information window':url==='the-solution.html'?'Solution machine window':'Negative-Software Solution window'):(image?.alt||node.getAttribute('aria-label')||node.textContent.trim()||'Image');let key=title.toLowerCase().replace(/\b(machine component detail|component detail)\b/g,'').replace(/\s+/g,' ').trim();const scene=(title+' '+(image?.src||'')).toLowerCase();if(/home-card-who-we-help|mobile-lite-who-we-help/.test(scene))key='navigation-industries';else if(/home-card-the-solution|mobile-lite-the-solution/.test(scene))key='navigation-solution';else if(/home-card-learning-center|mobile-lite-learning-center/.test(scene))key='navigation-good-information';else if(/guidance|working together|practical future/.test(scene))key='carousel-guidance';else if(/pizza/.test(scene))key='carousel-pizza';else if(/barbecue|bbq/.test(scene))key='carousel-barbecue';else if(/arcade/.test(scene))key='carousel-arcade';else if(/football/.test(scene))key='carousel-football';else if(/simplif/.test(scene))key='carousel-simplify';else if(/explain/.test(scene))key='carousel-explain';else if(/relax/.test(scene))key='carousel-relax';else if(/future/.test(scene))key='carousel-future';else if(/planning|plan practical/.test(scene))key='carousel-planning';else if(/solution-bottom-mechanical/.test(image?.src||''))key='solution-bottom-exception';if(items.has(key))continue;const clone=host.cloneNode(true);const originals=[host,...host.querySelectorAll('*')],copies=[clone,...clone.querySelectorAll('*')];for(let i=0;i<copies.length;i++){const st=frame.contentWindow.getComputedStyle(originals[i]);for(const prop of st)copies[i].style.setProperty(prop,st.getPropertyValue(prop),'important')}if(host.hasAttribute('data-ah-all-square-image-host')){for(const n of [clone,...clone.querySelectorAll('img')])for(const k of ['border-radius','border-start-start-radius','border-start-end-radius','border-end-start-radius','border-end-end-radius'])n.style.setProperty(k,'0','important');}clone.querySelectorAll('script').forEach(n=>n.remove());const rect=host.getBoundingClientRect();const w=rect.width||360,h=rect.height||250;for(const[k,v]of Object.entries({position:'relative',inset:'auto',margin:'0',transform:'none',width:w+'px',height:h+'px','max-width':'none','min-width':'0','clip-path':'none',visibility:'visible',opacity:'1'}))clone.style.setProperty(k,v,'important');for(const img of clone.querySelectorAll('img'))img.loading='eager';items.set(key,{title,clone,w,h,exception:!!image&&/solution-bottom-mechanical/.test(image.src)});}}frame.remove();return items;}
function cell(item,label){const div=document.createElement('section');div.className='cell';if(!item){div.innerHTML='<div class="missing">No equivalent gold-rimmed image on this layout</div>';return div}const h=document.createElement('h2');h.textContent=label+' · '+item.title+(item.exception?' · excluded from rim changes':'');div.append(h);const holder=document.createElement('div');holder.className='frame';const wrap=document.createElement('div');wrap.style.width=item.w+'px';wrap.append(item.clone);holder.append(wrap);div.append(holder);div.dataset.nativeWidth=item.w;div.dataset.nativeHeight=item.h;return div;}
function fit(){for(const c of document.querySelectorAll('.cell[data-native-width]')){const w=+c.dataset.nativeWidth,h=+c.dataset.nativeHeight,scale=Math.min(1,c.clientWidth/w);c.querySelector('.frame>div').style.transform='scale('+scale+')';c.querySelector('.frame').style.height=h*scale+'px';}}
(async()=>{let total=0;for(const[url,label]of pages){document.querySelector('#status').textContent='Collecting '+label+'…';const desktop=await collect(url,'desktop'),mobile=await collect(url,'mobile');for(const key of new Set([...desktop.keys(),...mobile.keys()])){const row=document.createElement('div');row.className='row';row.append(cell(desktop.get(key),label),cell(mobile.get(key),label));document.querySelector('#gallery').append(row);total++;}fit();}document.querySelector('#status').textContent=total+' image pairs · desktop left, mobile right';fit();})();addEventListener('resize',fit);
</script></body></html>
