</style><style id="ah-progress-no-flat-edge">html body #ah-page-progress#ah-page-progress,html body .rim-page-name-screen.rim-page-name-screen{border:0!important;border-image:none!important;outline:0!important;box-shadow:none!important}html body #ah-page-progress#ah-page-progress::before,html body #ah-page-progress#ah-page-progress::after,html body .rim-page-name-screen.rim-page-name-screen::before,html body .rim-page-name-screen.rim-page-name-screen::after{border:0!important;outline:0!important;box-shadow:none!important}html body #ah-page-progress :is(.ah-clean-surface-matte,.ah-clear-matte-edge,.ah-progress-matte),html body .rim-page-name-screen :is(.ah-clean-surface-matte,.ah-clear-matte-edge,.ah-progress-matte){visibility:hidden!important;box-shadow:none!important;border:0!important;outline:0!important}</style><style id="ah-intro-fifteen-percent">html,body{background:transparent!important;background-image:none!important}body::before{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}#copy{opacity:1!important}</style><style id="ah-opaque-metallic-intro">html{background:transparent!important}body{background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0px,rgba(255,255,255,.14) 1px,rgba(58,88,104,.025) 1px,rgba(58,88,104,.025) 2px,transparent 2px,transparent 4px),linear-gradient(115deg,transparent 12%,rgba(255,255,255,.5) 32%,transparent 47%,rgba(255,255,255,.28) 69%,transparent 83%),linear-gradient(110deg,rgb(193,225,214) 0%,rgb(226,206,220) 34%,rgb(185,209,226) 67%,rgb(221,237,231) 100%)!important;opacity:1!important}</style></head><body><div id="copy"></div><script>
const lines=[[['Ethical Automation ','#092d4c'],['empowers ','#d32681'],['the human & the mind.','#126b50']],[['Prioritizing ','#092d4c'],['Job-Retention ','#d32681'],['and Seamlessness.','#126b50']]];
const copy=document.getElementById('copy'),spans=[];
for(const segments of lines){const line=document.createElement('p');copy.append(line);for(const[text,color]of segments){const span=document.createElement('span');span.style.color=color;span.style.setProperty('--mobile-ink',color==='#092d4c'?'#082b46':color==='#d32681'?'#881349':'#101d26');span.textContent=text;line.append(span);spans.push({span,text});}}
async function start(){await document.fonts.load('600 38px Rajdhani');let size=parseFloat(getComputedStyle(copy).fontSize);if(innerWidth>=700){const widest=Math.max(...[...copy.children].map(p=>p.scrollWidth));if(widest>copy.clientWidth)size*=copy.clientWidth/widest;copy.style.fontSize=size+'px';}
for(const line of copy.children)line.style.minHeight=line.getBoundingClientRect().height+'px';for(const item of spans)item.span.textContent='';copy.style.visibility='visible';let segment=0,letter=0;
let timer;const pace=90,total=spans.reduce((n,item)=>n+item.text.length,0);let shown=0,elapsed=0,last=performance.now(),paused=false,done=false;
addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='ah:intro-pause')return;paused=!!event.data.paused;last=performance.now();clearTimeout(timer);if(!paused&&!done)timer=setTimeout(()=>type(performance.now()),pace);});
function type(now){if(done)return;const delta=now-last;last=now;if(!paused)elapsed+=delta;const target=Math.min(total,1+Math.floor(elapsed/pace));while(shown<target){const item=spans[segment];item.span.textContent=item.text.slice(0,++letter);shown++;if(letter===item.text.length){segment++;letter=0;}}if(elapsed>=(total-1)*pace+1100){done=true;parent.postMessage({type:'ah:intro-typing-complete'},location.origin);}else if(!paused)timer=setTimeout(()=>type(performance.now()),pace);}const begin=event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='ah:intro-start')return;removeEventListener('message',begin);last=performance.now();type(last);parent.postMessage({type:'ah:intro-started'},location.origin)};addEventListener('message',begin);parent.postMessage({type:'ah:intro-typing-ready'},location.origin);}

</script></body></html>
