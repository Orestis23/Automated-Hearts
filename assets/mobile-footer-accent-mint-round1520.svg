<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 90" preserveAspectRatio="none">
  <defs>
    <linearGradient id="tl" x1="10" y1="32" x2="55" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fffd7" stop-opacity="1"/>
      <stop offset=".38" stop-color="#8fffd7" stop-opacity="1"/>
      <stop offset=".72" stop-color="#8fffd7" stop-opacity=".56"/>
      <stop offset="1" stop-color="#8fffd7" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="br" x1="69" y1="70" x2="114" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fffd7" stop-opacity=".08"/>
      <stop offset=".28" stop-color="#8fffd7" stop-opacity=".56"/>
      <stop offset=".62" stop-color="#8fffd7" stop-opacity="1"/>
      <stop offset="1" stop-color="#8fffd7" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-18%" y="-25%" width="136%" height="150%">
      <feGaussianBlur stdDeviation="0.72" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- continuous trace around the flat carbon-fiber face -->
  <path d="M16 10H108L114 16V61L106 70H18L10 61V16Z"
        fill="none" stroke="#8fffd7" stroke-width="1.05" stroke-linejoin="miter" opacity=".48"/>
  <!-- stronger original accent zones, tapered into the continuous trace -->
  <path d="M10 34V16L16 10H55" fill="none" stroke="url(#tl)" stroke-width="2.15"
        stroke-linecap="butt" stroke-linejoin="miter" filter="url(#soft)"/>
  <path d="M69 70H106L114 61V38" fill="none" stroke="url(#br)" stroke-width="2.15"
        stroke-linecap="butt" stroke-linejoin="miter" filter="url(#soft)"/>
  <!-- hairline continuation gives the far reach a thinner shaded finish -->
  <path d="M55 10H108L114 16V38M69 70H18L10 61V34"
        fill="none" stroke="#8fffd7" stroke-width=".62" stroke-linejoin="miter" opacity=".72"/>
</svg>
