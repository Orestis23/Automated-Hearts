<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" preserveAspectRatio="none"><defs>
<path id="face-shape" d="M4 4H156V149H4Z"/>
<path id="inner-rim" d="M8 8H152V145H8Z"/>
<clipPath id="face-clip"><use href="#face-shape"/></clipPath>
<clipPath id="side-clip"><use href="#face-shape" transform="translate(0 4)"/></clipPath>
<pattern id="coarse-sand" width="9" height="9" patternUnits="userSpaceOnUse">
  <circle cx="1.2" cy="1.4" r=".72" fill="#ffd9ec" fill-opacity=".22"/>
  <circle cx="5.8" cy="2.1" r=".55" fill="#4f062e" fill-opacity=".28"/>
  <circle cx="3.3" cy="6.8" r=".82" fill="#ffb2dc" fill-opacity=".17"/>
  <circle cx="8" cy="7.4" r=".48" fill="#fff0f7" fill-opacity=".13"/>
  <path d="M0 4.7h2.5M6.8 5.2H9" stroke="#460624" stroke-opacity=".22" stroke-width=".45"/>
</pattern>
<filter id="sand-wear" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency=".18" numOctaves="3" seed="915" result="sand"/>
  <feColorMatrix in="sand" type="matrix" values=".30 0 0 0 .15  0 .24 0 0 .06  0 0 .30 0 .16  0 0 0 .28 0" result="grain"/>
  <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
</filter>

<linearGradient id="pink-depth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff70bd"/><stop offset=".32" stop-color="#e2359a"/><stop offset=".72" stop-color="#a61768"/><stop offset="1" stop-color="#4d062e"/></linearGradient>
<linearGradient id="face-light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6ffe5" stop-opacity=".08"/><stop offset=".26" stop-color="#7edbc7" stop-opacity=".05"/><stop offset=".58" stop-color="#ff4fb2" stop-opacity=".028"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
<linearGradient id="rim1389" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#a5c2ce"/><stop offset=".18" stop-color="#536f80"/><stop offset=".48" stop-color="#1c3445"/><stop offset=".78" stop-color="#08121d"/><stop offset="1" stop-color="#648594"/></linearGradient><marker id="ah1446-tip" markerWidth="1.4" markerHeight="1" refX="0.7" refY="0.5" viewBox="0 0 1.4 1" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L1.4 .5L0 1Z" fill="#ff3030"/></marker>
<!-- ah1580 desktop message full accent-surface gradients -->
<linearGradient id="ah1580-red-top" x1="14" y1="14" x2="136" y2="14" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#6d0505" stop-opacity=".55"/>
  <stop offset=".10" stop-color="#ff3030" stop-opacity=".96"/>
  <stop offset=".28" stop-color="#ff8a8a" stop-opacity="1"/>
  <stop offset=".58" stop-color="#ff3030" stop-opacity=".94"/>
  <stop offset=".86" stop-color="#ff3030" stop-opacity=".50"/>
  <stop offset="1" stop-color="#ff3030" stop-opacity=".10"/>
</linearGradient>
<linearGradient id="ah1580-red-bottom" x1="42" y1="139" x2="146" y2="76" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#ff3030" stop-opacity=".10"/>
  <stop offset=".18" stop-color="#ff3030" stop-opacity=".50"/>
  <stop offset=".46" stop-color="#ff3030" stop-opacity=".94"/>
  <stop offset=".74" stop-color="#ff8a8a" stop-opacity="1"/>
  <stop offset=".92" stop-color="#ff3030" stop-opacity=".96"/>
  <stop offset="1" stop-color="#6d0505" stop-opacity=".55"/>
</linearGradient>
<filter id="ah1580-red-soft" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
  <feGaussianBlur stdDeviation=".95" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<!-- Round 1646: subtler reflective glass face cover, confined inside the carbon surface. -->
<linearGradient id="ah1639-glass-main" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
  <stop offset=".10" stop-color="#e9fbff" stop-opacity=".07"/>
  <stop offset=".28" stop-color="#b8e8f2" stop-opacity=".018"/>
  <stop offset=".50" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset=".76" stop-color="#86b8c8" stop-opacity=".016"/>
  <stop offset="1" stop-color="#001018" stop-opacity=".10"/>
</linearGradient>
<linearGradient id="ah1639-glass-sweep" x1="0" y1="0" x2="1" y2=".75">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
  <stop offset=".16" stop-color="#ffffff" stop-opacity=".045"/>
  <stop offset=".34" stop-color="#d9f6ff" stop-opacity=".010"/>
  <stop offset=".46" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="ah1639-glass-glint" cx="26%" cy="0%" r="78%">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
  <stop offset=".20" stop-color="#ecfbff" stop-opacity=".055"/>
  <stop offset=".52" stop-color="#c8f3ff" stop-opacity=".010"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
</defs>

<use href="#face-shape" fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
<g clip-path="url(#face-clip)"><rect width="160" height="160" fill="url(#face-light)" opacity=".42"/></g>
<use href="#face-shape" fill="none" stroke="#8fffd7" stroke-width="2.4" stroke-linejoin="round"/>
<use href="#inner-rim" fill="none" stroke="#c1ffec" stroke-opacity=".80" stroke-width="1" stroke-linejoin="round"/>

<!-- Round 1639 reflective glass: inside the 14/14–146/139 carbon aperture only. -->
<g id="ah1639-reflective-glass" pointer-events="none">
  <rect x="14" y="14" width="132" height="125" rx="2" fill="url(#ah1639-glass-main)" opacity=".90"/>
  <rect x="14" y="14" width="132" height="125" rx="2" fill="url(#ah1639-glass-glint)" opacity=".86"/>
  <path d="M20 18H136Q142 18 143 24" fill="none" stroke="#f4fdff" stroke-opacity=".38" stroke-width="1.25"/>
  <path d="M19 27C48 13 81 15 106 29C121 37 132 37 142 29" fill="none" stroke="url(#ah1639-glass-sweep)" stroke-width="10" stroke-linecap="round" opacity=".58"/>
  <path d="M19 34C55 14 99 17 141 43" fill="none" stroke="#f7fdff" stroke-opacity=".085" stroke-width="14" stroke-linecap="round"/>
  <path d="M21 25C57 13 100 18 139 38" fill="none" stroke="#ffffff" stroke-opacity=".20" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M18 135H142" fill="none" stroke="#001019" stroke-opacity=".52" stroke-width="1.3"/>
</g>
<rect x="14" y="14" width="132" height="125" rx="2" fill="none" stroke="#020810" stroke-width="5"/><rect x="14" y="14" width="132" height="125" rx="2" fill="none" stroke="url(#rim1389)" stroke-width="2.8"/>
<!-- ah1580: message accents fill the same available bevel surfaces as footer accents, in envelope red. -->
<g id="ah1580-message-full-accent-surfaces" fill="none" stroke-linejoin="miter" pointer-events="none">
  <path d="M20 14H140Q146 14 146 20V133Q146 139 140 139H20Q14 139 14 133V20Q14 14 20 14Z"
        stroke="#ff3030" stroke-width="1.10" opacity=".42"/>
  <path d="M14 78V20Q14 14 20 14H136" stroke="#ff3030" stroke-opacity=".10" stroke-width="7" filter="url(#ah1580-red-soft)"/>
  <path d="M14 78V20Q14 14 20 14H136" stroke="url(#ah1580-red-top)" stroke-width="3.0"/>
  <path d="M14 78V20Q14 14 20 14H136" stroke="#ffd0d0" stroke-opacity=".30" stroke-width=".72"/>
  <path d="M42 139H140Q146 139 146 133V76" stroke="#ff3030" stroke-opacity=".10" stroke-width="7" filter="url(#ah1580-red-soft)"/>
  <path d="M42 139H140Q146 139 146 133V76" stroke="url(#ah1580-red-bottom)" stroke-width="3.0"/>
  <path d="M42 139H140Q146 139 146 133V76" stroke="#ffd0d0" stroke-opacity=".30" stroke-width=".72"/>
  <path d="M136 14H140Q146 14 146 20V76M42 139H20Q14 139 14 133V78" stroke="#ff3030" stroke-width=".66" opacity=".70"/>
</g>
</svg>