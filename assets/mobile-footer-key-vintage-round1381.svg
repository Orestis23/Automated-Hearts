<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 88" preserveAspectRatio="none">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8794a2"/>
      <stop offset="0.10" stop-color="#566575"/>
      <stop offset="0.28" stop-color="#273747"/>
      <stop offset="0.68" stop-color="#101b27"/>
      <stop offset="1" stop-color="#030910"/>
    </linearGradient>
    <linearGradient id="leftWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91a0ad"/>
      <stop offset="0.35" stop-color="#3f4e5d"/>
      <stop offset="1" stop-color="#0b131d"/>
    </linearGradient>
    <linearGradient id="rightWall" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5968"/>
      <stop offset="0.45" stop-color="#1c2937"/>
      <stop offset="1" stop-color="#050b12"/>
    </linearGradient>
    <linearGradient id="frontWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182534"/>
      <stop offset="0.55" stop-color="#071019"/>
      <stop offset="1" stop-color="#02060b"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26384c"/>
      <stop offset="0.20" stop-color="#17283a"/>
      <stop offset="0.72" stop-color="#0b1725"/>
      <stop offset="1" stop-color="#07111b"/>
    </linearGradient>
    <linearGradient id="faceSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".22" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".56" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <pattern id="carbon" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#0d1a28"/>
      <rect width="5" height="10" fill="#162739"/>
      <rect x="0" width="2" height="10" fill="#20354a" opacity=".65"/>
      <rect x="5" width="2" height="10" fill="#09131f" opacity=".85"/>
    </pattern>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7fff9"/>
      <stop offset="0.30" stop-color="#8fffd7"/>
      <stop offset="1" stop-color="#1c6b57"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- deep base -->
  <path d="M10 1 H110 L119 11 V72 L110 87 H10 L1 72 V11 Z" fill="url(#shell)" stroke="#02060b" stroke-width="2"/>
  <!-- pyramid side facets -->
  <path d="M10 1 L18 11 L18 65 L10 78 L1 72 V11 Z" fill="url(#leftWall)"/>
  <path d="M110 1 L102 11 L102 65 L110 78 L119 72 V11 Z" fill="url(#rightWall)"/>
  <path d="M10 78 L18 65 H102 L110 78 L110 87 H10 Z" fill="url(#frontWall)"/>
  <path d="M10 1 H110 L102 11 H18 Z" fill="#9eabb8" opacity=".35"/>
  <!-- raised carbon top face -->
  <path d="M18 10 H102 L108 16 V62 L101 69 H19 L12 62 V16 Z" fill="url(#face)" stroke="#5c7186" stroke-width="1.2"/>
  <path d="M18 10 H102 L108 16 V62 L101 69 H19 L12 62 V16 Z" fill="url(#carbon)" opacity=".55"/>
  <path d="M18 10 H102 L108 16 V62 L101 69 H19 L12 62 V16 Z" fill="url(#faceSheen)"/>
  <path d="M19 12 H101" stroke="#c7d8e8" stroke-opacity=".26" stroke-width="1"/>
  <path d="M14 18 V59" stroke="#c7d8e8" stroke-opacity=".14" stroke-width="1"/>
  <path d="M106 18 V59" stroke="#000" stroke-opacity=".42" stroke-width="1"/>
  <!-- front-edge LED strip -->
  <path d="M14 78 H106" stroke="url(#mint)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
</svg>
