<svg xmlns="http://www.w3.org/2000/svg" width="384" height="96" viewBox="0 0 384 96" preserveAspectRatio="none">
  <defs>
    <linearGradient id="face-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b43"/><stop offset=".35" stop-color="#071a2d"/>
      <stop offset=".72" stop-color="#03101e"/><stop offset="1" stop-color="#0c2840"/>
    </linearGradient>
    <linearGradient id="face-light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a6ffe5" stop-opacity=".10"/><stop offset=".28" stop-color="#3f7fa2" stop-opacity=".12"/>
      <stop offset=".62" stop-color="#ff4fb2" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="pink-depth" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff70bd"/><stop offset=".32" stop-color="#e2359a"/>
      <stop offset=".72" stop-color="#a61768"/><stop offset="1" stop-color="#4d062e"/>
    </linearGradient>
    <pattern id="coarse-sand" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.9" cy="2.2" r="1.12" fill="#d7edf0" fill-opacity=".16"/>
      <circle cx="9" cy="3.3" r=".86" fill="#000814" fill-opacity=".34"/>
      <circle cx="5.1" cy="10.6" r="1.28" fill="#7ca2b7" fill-opacity=".17"/>
      <circle cx="12.4" cy="11.5" r=".75" fill="#d8fff4" fill-opacity=".12"/>
      <path d="M0 7.3h3.9M10.6 8.1H14" stroke="#020812" stroke-opacity=".22" stroke-width=".7"/>
    </pattern>
    <filter id="sand-wear" x="-3%" y="-8%" width="106%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".115" numOctaves="3" seed="848" stitchTiles="stitch" result="sand"/>
      <feColorMatrix in="sand" type="matrix" values=".30 0 0 0 .08  0 .34 0 0 .10  0 0 .42 0 .15  0 0 0 .34 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
    </filter>
  </defs>
  <!-- Pressed mounting depth: side/front only and much shallower. -->
  <path d="M0 8h5v75h374V8h5v79H0Z" fill="#000"/>
  <!-- Pink depth nearly disappears when submerged. -->
  <g filter="url(#sand-wear)">
    <rect x="5" y="10" width="374" height="73" rx="7" fill="url(#pink-depth)"/>
    <rect x="5" y="10" width="374" height="73" rx="7" fill="url(#coarse-sand)" opacity=".54"/>
  </g>
  <g filter="url(#sand-wear)">
    <rect x="5" y="4" width="374" height="76" rx="7" fill="url(#face-base)"/>
    <rect x="5" y="4" width="374" height="76" rx="7" fill="url(#face-light)"/>
    <rect x="5" y="4" width="374" height="76" rx="7" fill="url(#coarse-sand)" opacity=".68"/>
  </g>
  <rect x="5" y="4" width="374" height="76" rx="7" fill="none" stroke="#8fffd7" stroke-width="2.2"/>
  <rect x="10" y="9" width="364" height="66" rx="4" fill="none" stroke="#b9ffe9" stroke-opacity=".78" stroke-width="1"/>
</svg>
