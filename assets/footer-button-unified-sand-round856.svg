<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160">
  <defs>
    <filter id="sand" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.19 0.31" numOctaves="3" seed="856" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="
        0.14 0 0 0 0.015
        0 0.21 0 0 0.055
        0 0 0.29 0 0.095
        0 0 0 0.34 0" result="navy-grain"/>
      <feBlend in="SourceGraphic" in2="navy-grain" mode="screen"/>
    </filter>
    <radialGradient id="light" cx="50%" cy="28%" r="88%">
      <stop offset="0" stop-color="#102b43"/>
      <stop offset="0.58" stop-color="#081c30"/>
      <stop offset="1" stop-color="#03101e"/>
    </radialGradient>
  </defs>
  <rect width="640" height="160" fill="#071a2d"/>
  <rect width="640" height="160" fill="url(#light)" opacity="0.68" filter="url(#sand)"/>
  <rect x="1" y="1" width="638" height="158" fill="none" stroke="#173a51" stroke-opacity="0.34"/>
