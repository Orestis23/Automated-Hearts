<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 90" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16385a"/>
      <stop offset=".18" stop-color="#0d2a48"/>
      <stop offset=".55" stop-color="#081b31"/>
      <stop offset="1" stop-color="#020a13"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#214c77"/>
      <stop offset=".35" stop-color="#123557"/>
      <stop offset=".74" stop-color="#071a2e"/>
      <stop offset="1" stop-color="#020910"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183c62"/>
      <stop offset=".42" stop-color="#0d2946"/>
      <stop offset=".78" stop-color="#06172a"/>
      <stop offset="1" stop-color="#02080f"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2a49"/>
      <stop offset=".38" stop-color="#071a2e"/>
      <stop offset="1" stop-color="#01070d"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22272c"/>
      <stop offset=".30" stop-color="#181c20"/>
      <stop offset=".72" stop-color="#101317"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".13"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".035"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <pattern id="carbon" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#15181b"/>
      <rect width="5" height="10" fill="#202428"/>
      <rect width="2" height="10" fill="#2b3035" opacity=".42"/>
      <rect x="5" width="1.5" height="10" fill="#0b0e11" opacity=".78"/>
    </pattern>
  <linearGradient id="rim1389" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#a5c2ce"/><stop offset=".18" stop-color="#536f80"/><stop offset=".48" stop-color="#1c3445"/><stop offset=".78" stop-color="#08121d"/><stop offset="1" stop-color="#648594"/></linearGradient>
<!-- Round 1639: mobile reflective glass face cover. -->
<linearGradient id="ah1639-glass-main" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset=".13" stop-color="#e9fbff" stop-opacity=".13"/><stop offset=".38" stop-color="#c5edf7" stop-opacity=".035"/><stop offset=".62" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#001018" stop-opacity=".10"/></linearGradient>
<radialGradient id="ah1639-glass-glint" cx="25%" cy="0%" r="82%"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".24" stop-color="#eafaff" stop-opacity=".11"/><stop offset=".62" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
</defs>
  <!-- dark navy pyramidal housing -->
  <path d="M10 1H114L123 12V72L112 89H12L1 72V12Z" fill="url(#base)" stroke="#01060b" stroke-width="2"/>
  <path d="M10 1L16 10V65L10 82L1 72V12Z" fill="url(#left)"/>
  <path d="M114 1L108 10V65L114 82L123 72V12Z" fill="url(#right)"/>
  <path d="M10 82L16 65H108L114 82V89H12Z" fill="url(#front)"/>
  <path d="M10 1H114L108 10H16Z" fill="#4d7194" opacity=".22"/>
  <!-- wider light-black carbon face -->
  <path d="M16 10H108L114 16V61L106 70H18L10 61V16Z" fill="url(#face)" stroke="#36516a" stroke-width="1.1"/>
  <path d="M16 10H108L114 16V61L106 70H18L10 61V16Z" fill="url(#carbon)" opacity=".74"/>
  <path d="M16 10H108L114 16V61L106 70H18L10 61V16Z" fill="url(#sheen)"/>
    <!-- Round 1639: glass follows the exact mobile carbon-face polygon. -->
  <g id="ah1639-reflective-glass" pointer-events="none">
    <path d="M16 10H108L114 16V61L106 70H18L10 61V16Z" fill="url(#ah1639-glass-main)" opacity=".90"/>
    <path d="M16 10H108L114 16V61L106 70H18L10 61V16Z" fill="url(#ah1639-glass-glint)" opacity=".84"/>
    <path d="M17 13H104Q109 13 111 18" fill="none" stroke="#f5fdff" stroke-opacity=".34" stroke-width=".85"/>
    <path d="M14 29C39 12 75 13 110 31" fill="none" stroke="#f8feff" stroke-opacity=".10" stroke-width="9" stroke-linecap="round"/>
    <path d="M16 20C43 11 76 14 108 28" fill="none" stroke="#ffffff" stroke-opacity=".20" stroke-width=".9" stroke-linecap="round"/>
    <path d="M15 66H105" fill="none" stroke="#001019" stroke-opacity=".52" stroke-width=".8"/>
  </g>
<path d="M18 12H106" stroke="#8db0cc" stroke-opacity=".19"/>
  <path d="M12 18V59" stroke="#6c93b4" stroke-opacity=".11"/>
  <path d="M112 18V59" stroke="#000" stroke-opacity=".48"/>
<path d="M16 10H108L114 16V61L106 70H18L10 61V16Z" fill="none" stroke="#020810" stroke-width="5.5" stroke-linejoin="round"/><path d="M16 10H108L114 16V61L106 70H18L10 61V16Z" fill="none" stroke="url(#rim1389)" stroke-width="3.2" stroke-linejoin="round"/>
</svg>
