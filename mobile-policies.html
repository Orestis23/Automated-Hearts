t\" href=\"./assets/round1656-bulb-industries-mobile.css?v=1656r\"/>\n</head><body data-ah-mobile-surface=\"about\">\n<span class=\"shell-edge t\"></span><span class=\"shell-edge b\"></span><span class=\"shell-edge l\"></span><span class=\"shell-edge r\"></span><span aria-hidden=\"true\" class=\"ah-opaque-corner ah-opaque-corner--tl\"></span><span aria-hidden=\"true\" class=\"ah-opaque-corner ah-opaque-corner--tr\"></span><span aria-hidden=\"true\" class=\"ah-opaque-corner ah-opaque-corner--bl\"></span><span aria-hidden=\"true\" class=\"ah-opaque-corner ah-opaque-corner--br\"></span>\n<a aria-label=\"Home\" class=\"heart\" href=\"./\"></a><div class=\"page-chip\" data-text=\"Privacy Policy\">Privacy Policy</div>\n<a aria-label=\"Send Message\" class=\"message\" data-ah-contact=\"Mobile Messages button\" data-contact-trigger=\"\" href=\"#contact-form\"><svg aria-hidden=\"true\" viewbox=\"0 0 32 22\"><path d=\"M2.5 2.5h27v17h-27z\"></path><path d=\"m3.5 4 12.5 9L28.5 4\"></path><path d=\"m3.5 18 8.8-7.1M28.5 18l-8.8-7.1\"></path></svg></a>\n<main class=\"ah-about-main\" id=\"main-content\">\n<h1 class=\"sr-only\">Privacy Policy</h1><section class=\"ah-about-policy\"><span aria-hidden=\"true\" class=\"ah1483-section-break ah1483-section-break--top\"></span><details class=\"policy\" id=\"policies\" open><summary>Privacy Policy</summary><div class=\"policy-body\"><h3>1. Scope</h3><p>This Privacy Policy explains how Automated Hearts collects, uses, discloses, retains, and protects personal information when you visit automatedhearts.com, contact us, request information, or work with us on a website, automation, AI, or related project. It applies to information handled by Automated Hearts; third-party websites, platforms, applications, and services have their own privacy practices.</p><h3>2. Information You Provide</h3><p>When you contact Automated Hearts, we may receive your name, email address, business or organization name, business type, message, project requirements, files, workflow information, and other information you voluntarily provide.</p><h3>3. Project Information</h3><p>During a client project, we may receive business records, workflow information, system information, files, credentials or access permissions, customer or operational information, and other data needed to perform the agreed work. Please do not provide highly sensitive personal information unless it is specifically necessary for an agreed project and appropriate safeguards have been discussed.</p><h3>4. Technical Information</h3><p>Our website and hosting infrastructure may automatically process limited technical information such as IP address, browser type, device type, operating system, requested pages, timestamps, referral information, and technical logs necessary to operate, secure, troubleshoot, and maintain the website.</p><h3>5. How We Use Information</h3><p>We use information to respond to inquiries, understand business needs, prepare proposals, provide requested services, design and support projects, communicate with clients, maintain and secure the website, troubleshoot technical issues, improve our services, maintain appropriate business records, and comply with applicable legal obligations.</p><h3>6. AI &amp; Automation Projects</h3><p>Some projects may involve artificial intelligence, automation platforms, APIs, cloud services, or other third-party technology. Client information may be processed through those systems when reasonably necessary to design, test, operate, or support the agreed solution. Automated Hearts does not intentionally use client confidential information for unrelated purposes or to develop unrelated general-purpose AI systems. Third-party providers may also be governed by their own contractual terms, privacy policies, account configuration, and security practices.</p><h3>7. Browser Storage, Cookies &amp; Analytics</h3><p>The website may use browser storage or similar technologies when necessary to maintain interface state, navigation behavior, performance settings, security functions, or other site functionality. If non-essential analytics, advertising technologies, or tracking practices are introduced, this policy and any legally required notice or choice mechanisms will be updated.</p><h3>8. When Information May Be Shared</h3><p>Information may be disclosed when reasonably necessary to providers supporting hosting, infrastructure, email, form delivery, scheduling, payment processing, cloud storage, security, analytics, AI, automation, or other services used for the website or a client project. Information may also be disclosed at a client's direction, as part of a business transaction, to professional advisers when necessary, or when reasonably required by law, legal process, security concerns, or protection of legal rights.</p><h3>9. Sale &amp; Targeted Advertising</h3><p>Automated Hearts does not sell personal information and does not use information submitted through this website for cross-site targeted advertising. If either practice changes, this policy and any legally required opt-out mechanisms will be updated before that practice is implemented.</p><h3>10. Data Retention</h3><p>Information is retained for as long as reasonably necessary for the reason it was collected, to provide or support services, maintain appropriate business and project records, resolve disputes, meet contractual obligations, or satisfy applicable legal, accounting, or security requirements. When information is no longer reasonably necessary, it may be deleted, anonymized, or securely disposed of where practical.</p><h3>11. Information Security</h3><p>Automated Hearts uses reasonable administrative, technical, and organizational safeguards appropriate to the type of information and system involved. No website, network, transmission method, cloud service, or storage system can guarantee absolute security.</p><h3>12. Your Privacy Choices &amp; Rights</h3><p>Depending on where you live and which privacy laws apply, you may have rights to confirm whether your personal data is being processed, request access to or a copy of your information, correct inaccurate information, request deletion, receive certain information in a portable format, and opt out of qualifying targeted advertising, sale of personal information, or qualifying profiling. You may also have the right to exercise privacy rights without discriminatory treatment. To submit a privacy request, contact automatedhearts@gmail.com and identify the request as a \u201cPrivacy Request.\u201d We may take reasonable steps to verify your identity before fulfilling a request.</p><h3>13. Appeals</h3><p>If Automated Hearts denies a privacy request and applicable law provides a right to appeal, you may appeal by emailing automatedhearts@gmail.com with the subject \u201cPrivacy Appeal\u201d and explaining why you believe the request should be reconsidered.</p><h3>14. Children</h3><p>Automated Hearts is a business-services company. Our website and services are not directed toward children under 13, and we do not knowingly seek to collect personal information from children. If we learn that personal information from a child was collected inappropriately, we will take reasonable steps to delete it.</p><h3>15. External Services &amp; Links</h3><p>The website or a client project may link to or interact with third-party websites and services. Automated Hearts does not control the independent privacy practices of those third parties.</p><h3>16. Changes to This Policy</h3><p>This policy may be revised as our website, services, vendors, or legal obligations change. The current version will be posted here with an updated revision date. Material changes will be identified when appropriate.</p><h3>17. Contact</h3><p>Questions about this Privacy Policy, personal information, or a privacy request can be sent to automatedhearts@gmail.com .</p><p style=\"margin-top:18px\"><strong>Last updated September 2, 2026.</strong></p></div></detail
