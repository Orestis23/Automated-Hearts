yle=\"transform:scaleX(0)!important\"\u003e\u003c/span\u003e\u003cspan aria-label=\"Privacy Policy\" class=\"footer-page-led header-page-led screen-text-canonical screen-text-canonical--green screen-text-size-page r383-reference-text\" data-text=\"Privacy Policy\"\u003ePrivacy Policy\u003c/span\u003e\n\u003c/div\u003e\n\u003ca aria-label=\"Send Message\" class=\"r973-pink-edge header-send-message mechanical-send-control\" data-contact-origin=\"header\" data-contact-trigger=\"\" data-nav=\"contact\" href=\"#contact\" id=\"header-send-message\"\u003e\u003cspan aria-hidden=\"true\" class=\"r1005-message-envelope\"\u003e\u003csvg focusable=\"false\" viewbox=\"0 0 32 22\"\u003e\u003cpath d=\"M2.5 2.5h27v17h-27z\"\u003e\u003c/path\u003e\u003cpath d=\"m3.5 4 12.5 9L28.5 4\"\u003e\u003c/path\u003e\u003cpath d=\"m3.5 18 8.8-7.1M28.5 18l-8.8-7.1\"\u003e\u003c/path\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/a\u003e\n\u003cmain class=\"r1061-about-main ah-about-main\" id=\"main-content\"\u003e\n\u003ch1 class=\"sr-only\"\u003ePrivacy Policy\u003c/h1\u003e\n\u003csection aria-label=\"Privacy Policy\" class=\"ah1524-policy-console\"\u003e\u003cdetails class=\"r1061-policy-console\" id=\"policies\" open=\"\"\u003e\n\u003csummary\u003e\n\u003cspan class=\"r1061-policy-title\"\u003ePrivacy Policy\u003c/span\u003e\n\u003cspan class=\"r1061-policy-subtitle\"\u003eHow information is collected, used, shared, retained, and protected\u003c/span\u003e\n\u003cspan aria-hidden=\"true\" class=\"r1061-policy-toggle\"\u003e+\u003c/span\u003e\n\u003c/summary\u003e\n\u003cdiv class=\"r1061-policy-content\"\u003e\n\u003csection class=\"r1061-policy-wide\"\u003e\u003ch3\u003e1. Scope\u003c/h3\u003e\u003cp\u003eThis Privacy Policy explains how Automated Hearts collects, uses, discloses, retains, and protects personal information when you visit automatedhearts.com, contact us, request information, or work with us on a website, automation, AI, or related project. It applies to information handled by Automated Hearts; third-party websites, platforms, applications, and services have their own privacy practices.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e2. Information You Provide\u003c/h3\u003e\u003cp\u003eWhen you contact Automated Hearts, we may receive your name, email address, business or organization name, business type, message, project requirements, files, workflow information, and other information you voluntarily provide.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e3. Project Information\u003c/h3\u003e\u003cp\u003eDuring a client project, we may receive business records, workflow information, system information, files, credentials or access permissions, customer or operational information, and other data needed to perform the agreed work. Please do not provide highly sensitive personal information unless it is specifically necessary for an agreed project and appropriate safeguards have been discussed.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e4. Technical Information\u003c/h3\u003e\u003cp\u003eOur website and hosting infrastructure may automatically process limited technical information such as IP address, browser type, device type, operating system, requested pages, timestamps, referral information, and technical logs necessary to operate, secure, troubleshoot, and maintain the website.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e5. How We Use Information\u003c/h3\u003e\u003cp\u003eWe use information to respond to inquiries, understand business needs, prepare proposals, provide requested services, design and support projects, communicate with clients, maintain and secure the website, troubleshoot technical issues, improve our services, maintain appropriate business records, and comply with applicable legal obligations.\u003c/p\u003e\u003c/section\u003e\n\u003csection class=\"r1061-policy-wide\"\u003e\u003ch3\u003e6. AI &amp; Automation Projects\u003c/h3\u003e\u003cp\u003eSome projects may involve artificial intelligence, automation platforms, APIs, cloud services, or other third-party technology. Client information may be processed through those systems when reasonably necessary to design, test, operate, or support the agreed solution. Automated Hearts does not intentionally use client confidential information for unrelated purposes or to develop unrelated general-purpose AI systems. Third-party providers may also be governed by their own contractual terms, privacy policies, account configuration, and security practices.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e7. Browser Storage, Cookies &amp; Analytics\u003c/h3\u003e\u003cp\u003eThe website may use browser storage or similar technologies when necessary to maintain interface state, navigation behavior, performance settings, security functions, or other site functionality. If non-essential analytics, advertising technologies, or tracking practices are introduced, this policy and any legally required notice or choice mechanisms will be updated.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e8. When Information May Be Shared\u003c/h3\u003e\u003cp\u003eInformation may be disclosed when reasonably necessary to providers supporting hosting, infrastructure, email, form delivery, scheduling, payment processing, cloud storage, security, analytics, AI, automation, or other services used for the website or a client project. Information may also be disclosed at a client's direction, as part of a business transaction, to professional advisers when necessary, or when reasonably required by law, legal process, security concerns, or protection of legal rights.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e9. Sale &amp; Targeted Advertising\u003c/h3\u003e\u003cp\u003eAutomated Hearts does not sell personal information and does not use information submitted through this website for cross-site targeted advertising. If either practice changes, this policy and any legally required opt-out mechanisms will be updated before that practice is implemented.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e10. Data Retention\u003c/h3\u003e\u003cp\u003eInformation is retained for as long as reasonably necessary for the reason it was collected, to provide or support services, maintain appropriate business and project records, resolve disputes, meet contractual obligations, or satisfy applicable legal, accounting, or security requirements. When information is no longer reasonably necessary, it may be deleted, anonymized, or securely disposed of where practical.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e11. Information Security\u003c/h3\u003e\u003cp\u003eAutomated Hearts uses reasonable administrative, technical, and organizational safeguards appropriate to the type of information and system involved. No website, network, transmission method, cloud service, or storage system can guarantee absolute security.\u003c/p\u003e\u003c/section\u003e\n\u003csection class=\"r1061-policy-wide\"\u003e\u003ch3\u003e12. Your Privacy Choices &amp; Rights\u003c/h3\u003e\u003cp\u003eDepending on where you live and which privacy laws apply, you may have rights to confirm whether your personal data is being processed, request access to or a copy of your information, correct inaccurate information, request deletion, receive certain information in a portable format, and opt out of qualifying targeted advertising, sale of personal information, or qualifying profiling. You may also have the right to exercise privacy rights without discriminatory treatment. To submit a privacy request, contact automatedhearts@gmail.com and identify the request as a \u201cPrivacy Request.\u201d We may take reasonable steps to verify your identity before fulfilling a request.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e13. Appeals\u003c/h3\u003e\u003cp\u003eIf Automated Hearts denies a privacy request and applicable law provides a right to appeal, you may appeal by emailing automatedhearts@gmail.com with the subject \u201cPrivacy Appeal\u201d and explaining why you believe the request should be reconsidered.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e14. Children\u003c/h3\u003e\u003cp\u003eAutomated Hearts is a business-services company. Our website and services are not directed toward children under 13, and we do not knowingly seek to collect personal information from children. If we learn that personal information from a child was collected inappropriately, we will take reasonable steps to delete it.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e15. External Services &amp; Links\u003c/h3\u003e\u003cp\u003eThe website or a client project may link to or interact with third-party websites and services. Automated Hearts does not control the independent privacy practices of those third parties.\u003c/p\u003e\u003c/section\u003e\n\u003csection\u003e\u003ch3\u003e16. Changes to This Policy\u003c/h3\u003e\u003cp\u003eThis policy may be revised as our website, services, vendors, or legal obligations change. The current version will be posted here with an updated revision date. Material changes will be identified when appropriate.\u003c/p\u003e\u003c/section\u003e\n\u003csection class=\"r1061-policy-wide\"\u003e\u003ch3\u003e17. Contact\u003c/h3\u003e\u003cp\u003eQuestions about this Privacy Policy, personal information, or a privacy request can be sent to \u003ca data-contact-origin=\"header\" data-contact-trigger=\"\" href=\"#contact\"\u003eautomatedhearts@gmail.com\u003c/a\u003e.\u003c/p\u003e\u003c/section\u003e\n\u003cp class=\"r1061-policy-updated\"\u003eLast updated September 2, 2026.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/details\u003e\u003c/section\u003e\u003c/main\u003e\n\u003cdiv class=\"home-hero-message-wrap reveal home-hero-message-wrap-round339\" id=\"home-ticker-wrap\"\ rol=\"2113\"\u003e\u003csvg aria-hidden=\"true\" viewbox=\"0 0 32 22\"\u003e\u003cpath d=\"M2.5 2.5h27v17h-27z\"\u003e\u003c/path\u003e\u003cpath d=\"m3.5 4 12.5 9L28.5 4\"\u003e\u003c/path\u003e\u003cpath d=\"m3.5 18 8.8-7.1M28.5 18l-8.8-7.1\"\u003e\u003c/path\u003e\u003c/svg\u003e\u003c/a\u003e\n\u003cmain class=\"ah-about-main\" id=\"main-content\"\u003e\n\u003ch1 class=\"sr-only\"\u003ePrivacy Policy\u003c/h1\u003e\u003csection class=\"ah-about-policy\"\u003e\u003cdetails class=\"policy\" id=\"policies\" open=\"\"\u003e\u003csummary\u003ePrivacy Policy\u003c/summary\u003e\u003cdiv class=\"policy-body\"\u003e\u003ch3\u003e1. Scope\u003c/h3\u003e\u003cp\u003eThis Privacy Policy explains how Automated Hearts collects, uses, discloses, retains, and protects personal information when you visit automatedhearts.com, contact us, request information, or work with us on a website, automation, AI, or related project. It applies to information handled by Automated Hearts; third-party websites, platforms, applications, and services have their own privacy practices.\u003c/p\u003e\u003ch3\u003e2. Information You Provide\u003c/h3\u003e\u003cp\u003eWhen you contact Automated Hearts, we may receive your name, email address, business or organization name, business type, message, project requirements, files, workflow information, and other information you voluntarily provide.\u003c/p\u003e\u003ch3\u003e3. Project Information\u003c/h3\u003e\u003cp\u003eDuring a client project, we may receive business records, workflow information, system information, files, credentials or access permissions, customer or operational information, and other data needed to perform the agreed work. Please do not provide highly sensitive personal information unless it is specifically necessary for an agreed project and appropriate safeguards have been discussed.\u003c/p\u003e\u003ch3\u003e4. Technical Information\u003c/h3\u003e\u003cp\u003eOur website and hosting infrastructure may automatically process limited technical information such as IP address, browser type, device type, operating system, requested pages, timestamps, referral information, and technical logs necessary to operate, secure, troubleshoot, and maintain the website.\u003c/p\u003e\u003ch3\u003e5. How We Use Information\u003c/h3\u003e\u003cp\u003eWe use information to respond to inquiries, understand business needs, prepare proposals, provide requested services, design and support projects, communicate with clients, maintain and secure the website, troubleshoot technical issues, improve our services, maintain appropriate business records, and comply with applicable legal obligations.\u003c/p\u003e\u003ch3\u003e6. AI &amp; Automation Projects\u003c/h3\u003e\u003cp\u003eSome projects may involve artificial intelligence, automation platforms, APIs, cloud services, or other third-party technology. Client information may be processed through those systems when reasonably necessary to design, test, operate, or support the agreed solution. Automated Hearts does not intentionally use client confidential information for unrelated purposes or to develop unrelated general-purpose AI systems. Third-party providers may also be governed by their own contractual terms, privacy policies, account configuration, and security practices.\u003c/p\u003e\u003ch3\u003e7. Browser Storage, Cookies &amp; Analytics\u003c/h3\u003e\u003cp\u003eThe website may use browser storage or similar technologies when necessary to maintain interface state, navigation behavior, performance settings, security functions, or other site functionality. If non-essential analytics, advertising technologies, or tracking practices are introduced, this policy and any legally required notice or choice mechanisms will be updated.\u003c/p\u003e\u003ch3\u003e8. When Information May Be Shared\u003c/h3\u003e\u003cp\u003eInformation may be disclosed when reasonably necessary to providers supporting hosting, infrastructure, email, form delivery, scheduling, payment processing, cloud storage, security, analytics, AI, automation, or other services used for the website or a client project. Information may also be disclosed at a client's direction, as part of a business transaction, to professional advisers when necessary, or when reasonably required by law, legal process, security concerns, or protection of legal rights.\u003c/p\u003e\u003ch3\u003e9. Sale &amp; Targeted Advertising\u003c/h3\u003e\u003cp\u003eAutomated Hearts does not sell personal information and does not use information submitted through this website for cross-site targeted advertising. If either practice changes, this policy and any legally required opt-out mechanisms will be updated before that practice is implemented.\u003c/p\u003e\u003ch3\u003e10. Data Retention\u003c/h3\u003e\u003cp\u003eInformation is retained for as long as reasonably necessary for the reason it was collected, to provide or support services, maintain appropriate business and project records, resolve disputes, meet contractual obligations, or satisfy applicable legal, accounting, or security requirements. When information is no longer reasonably necessary, it may be deleted, anonymized, or securely disposed of where practical.\u003c/p\u003e\u003ch3\u003e11. Information Security\u003c/h3\u003e\u003cp\u003eAutomated Hearts uses reasonable administrative, technical, and organizational safeguards appropriate to the type of information and system involved. No website, network, transmission method, cloud service, or storage system can guarantee absolute security.\u003c/p\u003e\u003ch3\u003e12. Your Privacy Choices &amp; Rights\u003c/h3\u003e\u003cp\u003eDepending on where you live and which privacy laws apply, you may have rights to confirm whether your personal data is being processed, request access to or a copy of your information, correct inaccurate information, request deletion, receive certain information in a portable format, and opt out of qualifying targeted advertising, sale of personal information, or qualifying profiling. You may also have the right to exercise privacy rights without discriminatory treatment. To submit a privacy request, contact automatedhearts@gmail.com and identify the request as a \u201cPrivacy Request.\u201d We may take reasonable steps to verify your identity before fulfilling a request.\u003c/p\u003e\u003ch3\u003e13. Appeals\u003c/h3\u003e\u003cp\u003eIf Automated Hearts denies a privacy request and applicable law provides a right to appeal, you may appeal by emailing automatedhearts@gmail.com with the subject \u201cPrivacy Appeal\u201d and explaining why you believe the request should be reconsidered.\u003c/p\u003e\u003ch3\u003e14. Children\u003c/h3\u003e\u003cp\u003eAutomated Hearts is a business-services company. Our website and services are not directed toward children under 13, and we do not knowingly seek to collect personal information from children. If we learn that personal information from a child was collected inappropriately, we will take reasonable steps to delete it.\u003c/p\u003e\u003ch3\u003e15. External Services &amp; Links\u003c/h3\u003e\u003cp\u003eThe website or a client project may link to or interact with third-party websites and services. Automated Hearts does not control the independent privacy practices of those third parties.\u003c/p\u003e\u003ch3\u003e16. Changes to This Policy\u003c/h3\u003e\u003cp\u003eThis policy may be revised as our website, services, vendors, or legal obligations change. The current version will be posted here with an updated revision date. Material changes will be identified when appropriate.\u003c/p\u003e\u003ch3\u003e17. Contact\u003c/h3\u003e\u003cp\u003eQuestions about this Privacy Policy, personal information, or a privacy request can be sent to automatedhearts@gmail.com .\u003c/p\u003e\u003cp style=\"margin-top:18px\"\u003e\u003cstrong\u003eLast updated September 2, 2026.\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003c/section\u003e
