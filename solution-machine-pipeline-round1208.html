// Activate a sign only for a tap/click, never a drag or pinch.
const signRaycaster=new THREE.Raycaster(),signPointer=new THREE.Vector2();let signPointerDown=null;
function signHit(ev){
 const r=renderer.domElement.getBoundingClientRect();
 signPointer.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
 signRaycaster.setFromCamera(signPointer,camera);
 const hits=signRaycaster.intersectObjects(clickableSigns,false);
 if(hits.length)return hits[0].object;
 if(ev.pointerType!=='touch'&&!matchMedia('(pointer:coarse)').matches)return null;
 let best=null,score=Infinity;
 for(const mesh of clickableSigns){
  if(mesh.material===signHitMaterial)continue;
  mesh.geometry.computeBoundingBox();mesh.updateWorldMatrix(true,false);
  const b=mesh.geometry.boundingBox;let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y]){
   const p=mesh.localToWorld(new THREE.Vector3(x,y,b.max.z)).project(camera);
   if(p.z<-1||p.z>1)continue;
   const px=r.left+(p.x+1)*r.width/2,py=r.top+(1-p.y)*r.height/2;
   minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py);
  }
  if(!Number.isFinite(minX))continue;
  const cx=(minX+maxX)/2,cy=(minY+maxY)/2,w=Math.max(48,maxX-minX+16),h=Math.max(48,maxY-minY+16);
  const dx=Math.abs(ev.clientX-cx),dy=Math.abs(ev.clientY-cy),d=dx*dx+dy*dy;
  if(dx<=w/2&&dy<=h/2&&d<score){best=mesh;score=d;}
 }
 return best;
}

let signFocusToken=0;
function navigateSolutionAnchor(hash){
 if(window.parent===window){location.href='./solutions.html'+hash;return}

}
function activateSolutionSign(hash){

 if(!localTarget){navigateSolutionAnchor(hash);return}

}
